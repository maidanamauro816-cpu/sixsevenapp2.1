name: Ktor Server CI

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "server/**"
      - ".github/workflows/ktor-server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/ktor-server-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile Ktor server
        working-directory: server
        run: gradle build
